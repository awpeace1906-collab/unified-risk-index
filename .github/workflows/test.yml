name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install numpy
      - run: python -m unittest discover -s tests -t . -v
      - run: python -m uri demo > /dev/null
